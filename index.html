<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Heatwave</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Heatwave 🌡️</h1>

  <div class="thermometer-container">
    <div id="cap" class="thermometer-cap"></div>
    <div class="thermometer-glass">
      <div id="mercury" class="mercury" style="height: 20%;"></div>
    </div>
    <div class="thermometer-bulb"></div>
  </div>

  <div class="game-area">
    <input type="text" id="guessInput" placeholder="Type your guess...">
    <button onclick="checkGuess()">Submit</button>
    <p id="message"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
